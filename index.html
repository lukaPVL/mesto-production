<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <title>Mesto</title>
  <script type="module" crossorigin src="./assets/index-E1xOhIrH.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CvHIBdo-.css">
</head>
<body class="page">
  <div class="page__content">
    <header class="header page__section">
      <img src="./assets/logo-CMFODZqH.svg" alt="Логотип проекта Место" class="logo header__logo">
    </header>
    
    <main class="content">
      <section class="profile page__section">
        <div class="profile__image"></div>
        <div class="profile__info">
          <h1 class="profile__title"></h1>
          <button class="profile__edit-button" type="button"></button>
          <p class="profile__description"></p>
        </div>
        <button class="profile__add-button" type="button"></button>
      </section>

      <section class="places page__section">
        <ul class="places__list">
        </ul>
      </section>
    </main>

    <footer class="footer page__section">
      <p class="footer__copyright">© 2026 Mesto Russia</p>
    </footer>

    <div class="popup popup_type_edit popup_is-animated">
      <div class="popup__content">
        <button type="button" class="popup__close"></button>
        <h3 class="popup__title">Редактировать профиль</h3>
        <form class="popup__form" name="edit-profile" novalidate>
          <input type="text" name="name" class="popup__input popup__input_type_name" placeholder="Имя" required minlength="2" maxlength="40" pattern="^[a-zA-Zа-яА-ЯёЁ\s\-]+$" data-error-message="Разрешены только латиница, кириллица, пробелы и дефисы">
          <span class="popup__error name-input-error"></span>
          <input type="text" name="description" class="popup__input popup__input_type_description" placeholder="О себе" required minlength="2" maxlength="200">
          <span class="popup__error description-input-error"></span>
          <button type="submit" class="button popup__button">Сохранить</button>
        </form>
      </div>
    </div>

    <div class="popup popup_type_new-card popup_is-animated">
      <div class="popup__content">
        <button type="button" class="popup__close"></button>
        <h3 class="popup__title">Новое место</h3>
        <form class="popup__form" name="new-place" novalidate>
          <input type="text" name="place-name" class="popup__input popup__input_type_card-name" placeholder="Название" required minlength="2" maxlength="30" pattern="^[a-zA-Zа-яА-ЯёЁ\s\-]+$" data-error-message="Разрешены только латиница, кириллица, пробелы и дефисы">
          <span class="popup__error place-name-input-error"></span>
          <input type="url" name="link" class="popup__input popup__input_type_url" placeholder="Ссылка на картинку" required>
          <span class="popup__error link-input-error"></span>
          <button type="submit" class="button popup__button">Создать</button>
        </form>
      </div>
    </div>

    <div class="popup popup_type_edit-avatar popup_is-animated">
      <div class="popup__content">
        <button type="button" class="popup__close"></button>
        <h3 class="popup__title">Обновить аватар</h3>
        <form class="popup__form" name="edit-avatar" novalidate>
          <input type="url" name="avatar" class="popup__input popup__input_type_avatar" placeholder="Ссылка на новый аватар" required>
          <span class="popup__error avatar-input-error"></span>
          <button type="submit" class="button popup__button">Сохранить</button>
        </form>
      </div>
    </div>

    <div class="popup popup_type_remove-card popup_is-animated">
      <div class="popup__content">
        <button type="button" class="popup__close"></button>
        <h3 class="popup__title">Вы уверены?</h3>
        <form class="popup__form" name="remove-card">
          <button type="submit" class="button popup__button">Да</button>
        </form>
      </div>
    </div>


    <div class="popup popup_type_image popup_is-animated">
      <div class="popup__content popup__content_content_image">
        <button type="button" class="popup__close"></button>
        <img src="" alt="" class="popup__image">
        <p class="popup__caption"></p>
      </div>
    </div>

    <div class="popup popup_type_info popup_is-animated">
      <div class="popup__content">
        <button type="button" class="popup__close"></button>
        <h3 class="popup__title">Информация о карточке</h3>
        <ul class="popup__info-list">
        </ul>
      </div>
    </div>
  </div>

  <template id="card-template">
    <li class="places__item card">
      <button class="card__control-button card__control-button_type_info" type="button"></button>
      <img class="card__image" src="" alt="" />
      <button type="button" class="card__delete-button"></button>
      <div class="card__description">
        <h2 class="card__title"></h2>
        <div class="card__like-container">
          <button type="button" class="card__like-button"></button>
          <span class="card__like-count"></span>
        </div>
      </div>
    </li>
  </template>

  <template id="popup-info-definition-template">
    <li class="popup__info-item">
      <span class="popup__info-label"></span>
      <span class="popup__info-value"></span>
    </li>
  </template>

</body>
</html>
